---
# Versions of Ansible to configure with pipx
# NOTE: the last version on the list will provide the 'unversioned' Ansible commands
ansible_controller_versions:
  - '2.18'
  - '2.20'
  - '2.16'  # This version will provide the unversioned Ansible commands

# Install the Bitwarden CLI
ansible_controller_utils_bitwarden: true
# Path to extra CA certificates, in case the CA is not trusted by the bw cli by default
ansible_controller_bitwarden_extra_ca: ''

# Git Repository to retrieve Ansible utils from
ansible_controller_utils_repo: 'https://github.com/Thulium-Drake/ansible-utils'

# Enable to extensively log GPG agent in order to debug issues with gpg-agent
ansible_controller_gpg_debug: false

# URL to download pwgen from on RHEL
# This RPM is available in EPEL and Fedora repos only
# Either put the name of the package, or the URL where to download it from
ansible_controller_pwgen_rhel_package: 'https://dl.fedoraproject.org/pub/epel/9/Everything/x86_64/Packages/p/pwgen-2.08-8.el9.x86_64.rpm'
ansible_controller_pwgen_gpgcheck: true  # If downloading the single RPM from EPEL, the gpgcheck will fail, so we skip
